name: Genera Schedine Giornaliere

on:
  schedule:
    - cron: '10 7 * * *' # Esegue tutti i giorni alle 07:10 UTC (08:10 ora italiana)
  workflow_dispatch: # Permette l'avvio manuale dal tasto Actions su GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests reportlab

      - name: Run script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODSS_KEY: ${{ secrets.ODSS_KEY }}
        run: |
          python bot.py

      - name: Commit and push changes (Storico aggiornato)
        run: |
          git config --global user.name "Bot Schedine"
          git config --global user.email "bot@users.noreply.github.com"
          git add storico_pronostici.json || true
          git commit -m "Aggiornamento automatico storico pronostici" || true
          git push || true
